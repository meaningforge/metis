name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Keep tag-time release execution on the same runner and toolchain path
      # that the release-packaging job in ci.yml exercises on every push, so the
      # first tag is not the first time this packaging path runs.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Release gate
        run: make release-check

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged release artifacts
        run: bash tools/ci/release-artifact-smoke.sh dist "$GITHUB_SHA"
